<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121214" />
    <meta
      name="description"
      content="Julio Espinola is a full-stack software engineer building React and TypeScript front ends, Java and Python services, and AWS infrastructure."
    />
    <link rel="canonical" href="https://juliosespinola.github.io/Portfolio-2.0/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://juliosespinola.github.io/Portfolio-2.0/" />
    <meta property="og:title" content="Julio Espinola, Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Projects, experience, and skills across React, Java/Spring, Python/FastAPI, and AWS."
    />
    <meta property="og:image" content="https://juliosespinola.github.io/Portfolio-2.0/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved/preferred color theme before React mounts,
      // so there's no flash of the wrong theme on first paint.
      (function () {
        try {
          var stored = window.localStorage.getItem("pf-theme-mode");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          var tokens = {
            light: {
              "--background": "#FAFAF9",
              "--surface": "#FFFFFF",
              "--text-primary": "#1A1A1A",
              "--text-secondary": "#5A5A5A",
              "--accent": "#6D5EF8",
              "--accent-contrast": "#FFFFFF",
              "--border": "#E5E5E3",
            },
            dark: {
              "--background": "#121214",
              "--surface": "#1C1C22",
              "--text-primary": "#F2F2F0",
              "--text-secondary": "#A0A0A8",
              "--accent": "#9B8CFF",
              "--accent-contrast": "#121214",
              "--border": "#2A2A30",
            },
          }[mode];
          tokens["--font-sans"] = "'Inter', 'Helvetica Neue', Arial, sans-serif";
          tokens["--font-mono"] = "'JetBrains Mono', 'Courier New', monospace";
          tokens["--radius-sm"] = "6px";
          tokens["--radius-md"] = "10px";
          tokens["--radius-lg"] = "16px";
          var root = document.documentElement;
          Object.keys(tokens).forEach(function (key) {
            root.style.setProperty(key, tokens[key]);
          });
          root.setAttribute("data-theme", mode);
        } catch (e) {
          // localStorage/matchMedia unavailable — React will set the theme on mount instead
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <title>Julio Espinola · Full-Stack Software Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
